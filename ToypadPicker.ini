[Listener]
Port=9191

; Optional. The app writes this section itself the first time you change the
; shortcut from the in-app Settings screen, so you normally never need to
; edit it by hand. Shown here for reference / manual tweaking.
[Shortcut]
; Type = Controller | Keyboard
Type=Controller
; Controller: raw XInput button bitmask (Back = 32). Combine buttons for a
; chord by adding their values, e.g. LB (256) + RB (512) = 768.
ControllerMask=32
; Keyboard: modifier bitmask (Alt=1, Ctrl=2, Shift=4, Win=8) and a virtual-key
; code. Easiest to leave both at 0 and set the keyboard shortcut from the
; Settings screen instead of computing VK codes by hand.
KeyModifiers=0
KeyCode=0
